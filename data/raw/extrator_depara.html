<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vita BI | Extrator de Itens De-Para</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .file-card {
            background: rgba(15, 23, 42, 0.5);
            padding: 24px;
            border-radius: 16px;
            border: 2px dashed var(--border);
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .file-card:hover {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }

        .file-card.loaded {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.05);
        }

        .file-card h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .file-card p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        input[type="file"] {
            display: none;
        }

        .btn-main {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
        }

        .btn-main:disabled {
            background: var(--border);
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-main:not(:disabled):hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .status {
            margin-top: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 16px;
            background: #000;
            border-radius: 8px;
            color: #4ade80;
            display: none;
        }

        .path-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 20px;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        code {
            color: #f472b6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gerador de Lista De-Para</h1>
    <p class="subtitle">Selecione os arquivos brutos para extrair os itens e gerar o Excel.</p>

    <div class="upload-section">
        <label class="file-card" id="card-items">
            <h3>1. Itens (qb_item)</h3>
            <p>Localize o arquivo <code>qb_item_...jsonl</code></p>
            <input type="file" id="input-items" accept=".jsonl">
            <span id="status-items">Aguardando arquivo...</span>
        </label>

        <label class="file-card" id="card-invoices">
            <h3>2. Faturas (qb_invoice)</h3>
            <p>Localize o arquivo <code>qb_invoice_...jsonl</code></p>
            <input type="file" id="input-invoices" accept=".jsonl">
            <span id="status-invoices">Aguardando arquivo...</span>
        </label>
    </div>

    <button id="btn-process" class="btn-main" disabled>Gerar Excel de Mapeamento</button>

    <div id="log" class="status"></div>

    <div class="path-hint">
        💡 <strong>Dica:</strong> Os arquivos estão na pasta do projeto em:<br>
        <code>C:\VitaBi\vita_bi\vita_bi\data\raw</code>
    </div>
</div>

<script>
    const inputItems = document.getElementById('input-items');
    const inputInvoices = document.getElementById('input-invoices');
    const btnProcess = document.getElementById('btn-process');
    const log = document.getElementById('log');

    let itemsData = null;
    let invoicesFile = null;

    function updateLog(msg) {
        log.style.display = 'block';
        log.innerHTML += `> ${msg}<br>`;
        log.scrollTop = log.scrollHeight;
    }

    inputItems.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('card-items').classList.add('loaded');
        document.getElementById('status-items').textContent = '✅ ' + file.name;
        
        updateLog(`Lendo catálogo de itens: ${file.name}`);
        const text = await file.text();
        const lines = text.split('\n');
        itemsData = {};
        lines.forEach(line => {
            if (line.trim()) {
                try {
                    const item = JSON.parse(line);
                    itemsData[item.Id] = {
                        Name: item.Name || '',
                        Desc: item.Description || ''
                    };
                } catch(err) {}
            }
        });
        updateLog(`Catálogo carregado: ${Object.keys(itemsData).length} itens.`);
        checkReady();
    };

    inputInvoices.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        invoicesFile = file;
        document.getElementById('card-invoices').classList.add('loaded');
        document.getElementById('status-invoices').textContent = '✅ ' + file.name;
        updateLog(`Arquivo de faturas selecionado: ${file.name}`);
        checkReady();
    };

    function checkReady() {
        btnProcess.disabled = !(itemsData && invoicesFile);
    }

    btnProcess.onclick = async () => {
        btnProcess.disabled = true;
        btnProcess.textContent = 'Processando...';
        updateLog('Iniciando processamento das faturas (pode demorar alguns segundos)...');

        const text = await invoicesFile.text();
        const lines = text.split('\n');
        const extracted = {};

        lines.forEach(line => {
            if (!line.trim()) return;
            try {
                const inv = JSON.parse(line);
                const invNo = inv.DocNumber || 'N/A';
                const invDate = inv.TxnDate || '';
                
                (inv.Line || []).forEach(l => {
                    if (l.DetailType !== 'SalesItemLineDetail') return;
                    const detail = l.SalesItemLineDetail || {};
                    const itemId = detail.ItemRef?.value;
                    const desc = (l.Description || '').trim();
                    if (!itemId) return;

                    const key = `${itemId}|${desc}`;
                    if (!extracted[key]) {
                        extracted[key] = {
                            itemId,
                            desc,
                            count: 0,
                            firstDate: invDate,
                            exInv: invNo
                        };
                    }
                    extracted[key].count++;
                    if (invDate < extracted[key].firstDate) {
                        extracted[key].firstDate = invDate;
                        extracted[key].exInv = invNo;
                    }
                });
            } catch(e) {}
        });

        const rows = Object.values(extracted).map(info => {
            const base = itemsData[info.itemId] || {};
            return {
                "qb_raw_pattern": info.desc || base.Name || info.itemId,
                "match_type": info.desc ? "contains" : "exact",
                "clean_name": "",
                "category": "",
                "subcategory": "",
                "brand": "",
                "unit_of_measure": "",
                "pack_size": "",
                "priority": 100,
                "active": "TRUE",
                "CONTEXTO_Código_QB": base.Name || info.itemId,
                "CONTEXTO_Desc_QB": base.Desc || '',
                "CONTEXTO_Vendas": info.count,
                "CONTEXTO_Primeira_Venda": info.firstDate,
                "CONTEXTO_Ex_Invoice": info.exInv
            };
        });

        // Ordenar por volume de vendas
        rows.sort((a, b) => b.CONTEXTO_Vendas - a.CONTEXTO_Vendas);

        updateLog(`Extração concluída: ${rows.length} combinações únicas encontradas.`);
        
        // Gerar Excel
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "De-Para para Preencher");
        
        XLSX.writeFile(wb, "VITA_BI_PARA_MAPEAR.xlsx");
        
        updateLog('Sucesso! O download do Excel deve iniciar automaticamente.');
        btnProcess.textContent = 'Gerar Novamente';
        btnProcess.disabled = false;
    };

</script>

</body>
</html>
